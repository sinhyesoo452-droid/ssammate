
name: SsaemMate AI Functional Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  functional-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium webkit

      - name: Functional test
        run: |
          mkdir -p test-results

          cat > website-test.cjs <<'JS'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');

          const SITE_URL = 'https://sinhyesoo452-droid.github.io/ssammate/';
          const results = [];

          function saveReport() {
            fs.writeFileSync(
              'test-results/report.json',
              JSON.stringify(results, null, 2)
            );
          }

          function record(result) {
            results.push(result);
            saveReport();
            console.log(JSON.stringify(result));
          }

          process.on('exit', saveReport);
          saveReport();

          async function reset(page) {
            const response = await page.goto(SITE_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 45000
            });

            if (!response || !response.ok()) {
              throw new Error('Website loading failed');
            }

            await page.locator('body').waitFor({
              state: 'visible',
              timeout: 10000
            });
          }

          async function test(page, env, name, fn) {
            const errors = [];
            const listener = e => errors.push(e.message);

            page.on('pageerror', listener);

            try {
              await reset(page);
              const detail = await fn();

              if (errors.length) {
                throw new Error(errors.join('; '));
              }

              record({
                env,
                name,
                status: detail === 'UNVERIFIED'
                  ? 'UNVERIFIED' : 'PASS',
                detail
              });

            } catch (e) {
              record({
                env,
                name,
                status: 'FAIL',
                error: e.message
              });

              await page.screenshot({
                path: `test-results/${env}-${results.length}-error.png`,
                fullPage: true,
                timeout: 5000
              }).catch(() => {});

            } finally {
              page.off('pageerror', listener);
            }
          }

          async function run(engine, browserName, device, viewport) {
            const env = `${browserName}-${device}`;
            let browser;

            try {
              browser = await engine.launch();

              const page = await browser.newPage({
                viewport,
                acceptDownloads: true
              });

              page.setDefaultTimeout(5000);

              await test(page, env, 'Website loading', async () => {
                await page.waitForLoadState('load', {
                  timeout: 20000
                });

                const broken = await page.locator('img').evaluateAll(
                  imgs => imgs.filter(
                    i => !i.complete || !i.naturalWidth
                  ).map(i => i.src)
                );

                if (broken.length) {
                  throw new Error(broken.join('; '));
                }

                return await page.title();
              });

              await reset(page);

              const navs = await page.locator('[data-nav]').evaluateAll(
                els => [...new Set(els.map(e => e.dataset.nav))]
              );

              record({
                env,
                name: 'Navigation count',
                status: navs.length === 6 ? 'PASS' : 'FAIL',
                detail: `Found ${navs.length} navigation items`
              });

              for (const nav of navs) {
                await test(page, env, `Navigation: ${nav}`, async () => {
                  const button = page.locator(
                    `[data-nav="${nav}"]:visible`
                  ).first();

                  const before = await page.locator('body').innerText();
                  const scrollBefore = await page.evaluate(() => scrollY);

                  await button.click();
                  await page.waitForTimeout(700);

                  const after = await page.locator('body').innerText();
                  const scrollAfter = await page.evaluate(() => scrollY);

                  if (before === after && scrollBefore === scrollAfter) {
                    return 'UNVERIFIED';
                  }

                  return 'Navigation responded';
                });
              }

              for (let i = 0; i < 8; i++) {
                await test(page, env, `Feature ${i + 1}`, async () => {
                  const button = page.locator(
                    `[data-go="${i}"]:visible`
                  ).first();

                  const before = await page.locator('body').innerText();

                  await button.click();
                  await page.waitForTimeout(500);

                  const after = await page.locator('body').innerText();

                  if (before === after) {
                    return 'UNVERIFIED';
                  }

                  return 'Feature screen changed';
                });
              }

              await test(page, env, 'Exam review prompt', async () => {
                const review = page.locator('#reviewGenerate');

                if (!await review.isVisible()) {
                  await page.locator('[data-go="1"]:visible')
                    .first().click();
                }

                await review.waitFor({state: 'visible'});

                await page.locator('#content').fill(
                  'Choose the correct answer. I ___ a student. ① am ② is ③ are'
                );

                await page.locator('#reviewKey').fill('1번 ①');
                await page.locator('#reviewContext').fill('중학교 영어');

                await review.click();

                const prompt = page.locator('#reviewPrompt');

                await prompt.waitFor({state: 'visible'});

                const value = await prompt.evaluate(
                  el => el.value || el.innerText || el.textContent || ''
                );

                if (!value.includes('I ___ a student')) {
                  throw new Error('Exam content missing from prompt');
                }

                if (!await page.locator('#reviewCopy').isEnabled()) {
                  throw new Error('Copy button disabled');
                }

                return 'Exam review prompt generated';
              });

              await test(page, env, 'File upload interface', async () => {
                const upload = page.locator('#upload');

                if (!await upload.count()) {
                  throw new Error('File input missing');
                }

                const accept = await upload.getAttribute('accept');

                return `Accepted file types: ${accept || 'all'}`;
              });

              await reset(page);

              await page.screenshot({
                path: `test-results/${env}.png`,
                fullPage: true,
                timeout: 10000
              });

              const inventory = await page.locator(
                'button, input, textarea, select, [data-go], [data-nav]'
              ).evaluateAll(els => els.map(e => ({
                tag: e.tagName,
                id: e.id,
                text: e.innerText || '',
                type: e.type || '',
                go: e.dataset.go,
                nav: e.dataset.nav
              })));

              fs.writeFileSync(
                `test-results/${env}-inventory.json`,
                JSON.stringify(inventory, null, 2)
              );

            } catch (e) {
              record({
                env,
                name: 'Environment',
                status: 'FAIL',
                error: e.message
              });

            } finally {
              if (browser) {
                await browser.close().catch(() => {});
              }
              saveReport();
            }
          }

          (async () => {
            for (const [name, engine] of [
              ['chromium', chromium],
              ['webkit', webkit]
            ]) {
              for (const [device, viewport] of [
                ['desktop', {width: 1440, height: 900}],
                ['mobile', {width: 390, height: 844}]
              ]) {
                await run(engine, name, device, viewport);
              }
            }

            for (const name of [
              'Multi-page PDF extraction',
              'PDF OCR',
              'HWPX extraction',
              'DOCX extraction',
              'PPTX extraction',
              'XLSX extraction',
              'Image-based questions',
              'Image insertion',
              'DOCX download',
              'HWPX download',
              'HTML download',
              'TXT download',
              'PDF export',
              'Autosave and restore',
              'Backup and deletion',
              'Clipboard contents',
              'External AI links',
              'Exact SVG hit areas'
            ]) {
              record({
                name,
                status: 'UNVERIFIED',
                detail: 'Requires dedicated functional assertions'
              });
            }

            saveReport();

            const summary = {
              PASS: results.filter(r => r.status === 'PASS').length,
              FAIL: results.filter(r => r.status === 'FAIL').length,
              UNVERIFIED: results.filter(
                r => r.status === 'UNVERIFIED'
              ).length
            };

            fs.writeFileSync(
              'test-results/summary.json',
              JSON.stringify(summary, null, 2)
            );

            console.log('TEST SUMMARY:', summary);

            if (summary.FAIL > 0) {
              process.exitCode = 1;
            }

          })().catch(e => {
            record({
              name: 'Fatal error',
              status: 'FAIL',
              error: e.message
            });
            process.exitCode = 1;
          });
          JS

          node website-test.cjs

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          path: test-results/
          retention-days: 14
